<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Guías de identificación de países para GeoGuessr: una meta cada vez. / Country identification guides for GeoGuessr, one meta at a time."
		/>
		<meta name="robots" content="noindex, nofollow" />
		<meta name="author" content="GeoIdentifier" />
		<meta name="theme-color" content="#0c0a09" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link
			rel="canonical"
			href="https://andyechc.github.io/geoidentifier/"
		/>
		<meta
			property="og:type"
			content="website"
		/>
		<meta property="og:site_name" content="GeoIdentifier" />
		<meta property="og:title" content="GeoIdentifier — Identify the country, not the region" />

			property="og:description"
			content="Country identification guides for GeoGuessr: 29 countries, 250 metas with photos, in English and Spanish."

		<meta name="twitter:title" content="GeoIdentifier — Identify the country, not the region" />
		<meta
			name="twitter:description"
			content="Country identification guides for GeoGuessr: 29 countries, 250 metas with photos, in English and Spanish."
		/>
		<meta name="twitter:image" content="https://andyechc.github.io/geoidentifier/og.jpg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
